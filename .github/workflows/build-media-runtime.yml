name: Build media runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates xz-utils python3 meson ninja-build \
            pkg-config nasm autoconf automake libtool \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 mingw-w64-tools
      - name: Build and package pinned sources
        run: bash scripts/runtime/build/build.sh "$RUNNER_TEMP/ufriend-ffmpeg-build" "$GITHUB_WORKSPACE/local/runtime-build-output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg-runtime-build
          path: |
            local/runtime-build-output/*.zip
            local/runtime-build-output/*.tar.xz
            local/runtime-build-output/*.json
            local/runtime-build-output/build.log
          if-no-files-found: error
          retention-days: 14

  verify-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-runtime-build
          path: local/runtime-build-output
      - name: Exercise static Windows executables
        shell: pwsh
        run: ./scripts/runtime/build/verify-runtime.ps1 -ArtifactDirectory ./local/runtime-build-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg-runtime-verified
          path: |
            local/runtime-build-output/*.zip
            local/runtime-build-output/*.tar.xz
            local/runtime-build-output/*.json
          if-no-files-found: error
          retention-days: 14
